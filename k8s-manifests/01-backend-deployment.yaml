apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-backend
  labels:
    app: vote-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote-backend
  template:
    metadata:
      labels:
        app: vote-backend
    spec:
      containers:
        - name: vote-backend
          image: 865189140490.dkr.ecr.us-east-1.amazonaws.com/demo/vote-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10