apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-frontend
  labels:
    app: vote-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote-frontend
  template:
    metadata:
      labels:
        app: vote-frontend
    spec:
      containers:
        - name: vote-frontend
          image: 865189140490.dkr.ecr.us-east-1.amazonaws.com/demo/vote-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80